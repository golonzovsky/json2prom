[package]
name = "json2prom"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
jaq-core = "3.0.0"
jaq-json = "2.0.0"
jaq-std = "3.0.0"
prometheus = "0.14.0"
reqwest = { version = "0.13.4", features = ["gzip", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
